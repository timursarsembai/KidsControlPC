name: kidscontrol

services:
  db:
    image: postgres:16-alpine
    container_name: kidscontrol-db
    restart: unless-stopped
    # Deliberately no `ports:` — the database is reachable only from the
    # internal network. Backups run through `docker exec ... pg_dump`.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Server locale is C; without this initdb picks a collation that sorts
      # Cyrillic by byte value, which shows up much later as wrongly ordered
      # device names in the panel.
      LANG: C.UTF-8
    command:
      - postgres
      # 7.7 GB box with ~3.2 GB free and swap already in use. These keep
      # Postgres inside the 512 MB limit below instead of being OOM-killed.
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  api:
    build: .
    container_name: kidscontrol-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Same reason as in the Dockerfile, but for runtime: any outbound call
      # (mail, webhooks) hangs on Happy Eyeballs without both flags. Set here
      # as well so it can be changed without rebuilding the image.
      NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection
    # Bound to loopback only; Nginx Proxy Manager reaches it by container name
    # over proxy-network. Same convention as every other project on this box.
    ports:
      - '127.0.0.1:8092:8092'
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8092/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal
      - proxy-network

  # Outgoing mail for kidscontrol.kz, and only for it.
  #
  # Not mailcow: that one relays everything through Resend on a single account,
  # whose free plan covers one domain — the payment project's. Rewiring it to
  # route per-domain means editing the Postfix config of a live mail server
  # that other people's money depends on, to add a second domain that sends a
  # handful of password-recovery letters a month.
  #
  # This one delivers straight to the recipient's MX and signs with its own
  # DKIM key. No ports published: it is reachable only from the API container.
  mail:
    image: boky/postfix:latest
    container_name: kidscontrol-mail
    restart: unless-stopped
    environment:
      # The name used in HELO and in the DKIM signature. Has to match the DNS
      # records, or every check on the receiving side fails at once.
      HOSTNAME: mail.kidscontrol.kz
      ALLOWED_SENDER_DOMAINS: kidscontrol.kz
      DKIM_SELECTOR: mail
      # Without this the image starts happily with no key and signs nothing —
      # and unsigned mail from an address whose PTR belongs to the hosting
      # provider goes straight to spam.
      DKIM_AUTOGENERATE: "true"
      # Only the API container may hand it mail.
      MYNETWORKS: 172.16.0.0/12
    volumes:
      - dkim:/etc/opendkim/keys
    mem_limit: 96m
    networks:
      - internal

  # The parent panel: static files behind the same Nginx Proxy Manager that
  # fronts everything else on this box. Built from the repository root because
  # it imports the shared workspace.
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: kidscontrol-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:8094:80'
    mem_limit: 64m
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health || exit 1']
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - proxy-network

volumes:
  pgdata:
  # The DKIM key. Generated once on first start; losing it means every
  # signature stops verifying until a new key reaches DNS.
  dkim:

networks:
  internal:
  proxy-network:
    external: true
