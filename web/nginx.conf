server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # TLS, HSTS and the real client address are Nginx Proxy Manager's job — this
  # server only ever sees traffic that already came through it.

  # Hashed asset names, so they can be cached hard. index.html must not be:
  # it is what points at the current hashes, and a cached copy would keep
  # sending browsers to files a deploy has already removed.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: /invite, /action and any deep link are routed in the
  # browser, so unknown paths have to return the app rather than a 404.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
